<!-- 3. Master Loader: Loads ALL HTML first, THEN loads JS files in order -->
<script>
  // List of your JS files in the exact order from 550_Admin_App.html
  const jsFiles = [
    "supabase_config.js",
    "551_Admin_Auth_JS.js",
    "553_Admin_Header_JS.js",
    "555_Admin_Dashboard_JS.js",
    "556_Admin_UpdateCan_JS.js",
    "557_Admin_Tran_Order_JS.js",
    "558_Admin_Tran_DeliveryQC_JS.js",
    "559_Admin_Tran_Escalations_JS.js",
    "560_Admin_Dormant_CRM_JS.js",
    "561_Admin_Master_Customer_JS.js",
    "562_Admin_User_Access_JS.js",
    "564_Admin_Tran_Sales_JS.js",
    "565_Admin_Tran_Pays_JS.js",
    "566_Admin_360_Modal_JS.js",
    "567_Admin_Push_Notifications_JS.js",
    "568_Admin_SysConfig_JS.js",
    "569_Admin_Handshake_JS.js",
    "580_1_Admin_DailySalesReports_JS.js",
    "580_2_Admin_Outstanding_JS.js",
    "580_3_Admin_Dormant_JS.js",
    "580_4_Admin_Sales_JS.js",
    "580_5_Admin_Pays_JS.js",
    "580_6_Admin_Orders_JS.js",
    "580_7_Admin_Delivery_JS.js",
    "580_9_Admin_CRM_Reports_JS.js",
    "581_0_Admin_Reports_Customer_JS.js",
    "581_1_Admin_Report_Week_JS.js",
    "590_Admin_Password_JS.js"
  ];

  async function bootAdminApp() {
    // STEP 1: Fetch all HTML views in parallel and inject them into the DOM
    const elements = document.querySelectorAll('[data-include]');
    await Promise.all(Array.from(elements).map(async (el) => {
      const file = el.getAttribute('data-include');
      const response = await fetch(file);
      if (response.ok) {
        let html = await response.text();

        // FIX: Remove VS Code Live Server's injected script so it doesn't break SVGs!
        //html = html.replace(/<!-- Code injected by live-server -->[\s\S]*?<\/script>/gi, '');

          el.outerHTML = html;
      } else {
        console.error("Failed to load view:", file);
      }
    }));

    // STEP 2: Now that 100% of the HTML exists on the page, load JS files in exact order
    for (const src of jsFiles) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = false; // Guarantees execution order
        script.onload = resolve;
        script.onerror = () => {
          console.error("Failed to load script:", src);
          resolve(); // Continue loading even if one file has an issue
        };
        document.body.appendChild(script);
      });
    }

    // STEP 3: If any of your JS files used window.onload or DOMContentLoaded, 
    // manually trigger them now so they run as expected!
    window.dispatchEvent(new Event('DOMContentLoaded'));
    window.dispatchEvent(new Event('load'));
    console.log("✅ WowDrops Admin App Fully Loaded!");
  }

  // Start the boot process
  bootAdminApp();
</script>
