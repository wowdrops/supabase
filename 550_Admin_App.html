<!DOCTYPE html>
<!-- SPA Pre-Requisite: `dark` class toggle applied on the root HTML dynamically via JS -->
<html lang="en">
<head>
  <base target="_top">
  <title>WOWDROPS - Admin Portal</title>
  <link rel="icon" type="image/x-icon" href="wowLogo_admin.jpg">
  <link rel="manifest" href="manifest_admin.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    darkMode: 'class', 
    theme: {
      extend: {}
    }
  }
</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="550_Admin_App_CSS.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

<!-- Ensure Auth is loaded directly so the user can log in -->
<div data-include="551_Admin_Auth.html"></div>

<!-- The Main Workspace (Revealed post-login) -->
<div id="view-workspace" class="hidden h-[100dvh] w-full relative">
  
  <div data-include="553_Admin_Header.html"></div>

  <div class="flex h-full w-full overflow-hidden relative">
    
    <div data-include="554_Admin_Sidebar.html"></div>

    <main id="scroll-area" class="flex-1 overflow-y-auto pt-24 pb-8 px-4 md:px-8 w-full relative hide-scrollbar scroll-smooth">
      
      <!-- THIS IS THE NEW LAZY LOAD DROP ZONE -->
      <div id="dynamic-module-workspace" class="w-full h-full relative">
        <!-- Fetched HTML modules will be injected here on demand -->
        
        <!-- CORE UTILITY: Pre-load the Password Screen -->
        <div data-include="590_Admin_Password.html"></div>
      </div>

    </main>
  </div>
</div>

<div data-include="566_Admin_360_Modal.html"></div>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('firebase-messaging-sw.js');
    });
  }
</script>
<!-- Master Loader: Fetches ONLY the Core Shell HTML, then boots JS -->
<script>
  const jsFiles = [
    "supabase_config.js",
    "551_Admin_Auth_JS.js",
    "553_Admin_Header_JS.js",
    "555_Admin_Dashboard_JS.js",
    "556_Admin_UpdateCan_JS.js",
    "557_Admin_Tran_Order_JS.js",
    "558_Admin_Tran_DeliveryQC_JS.js",
    "559_Admin_Tran_Escalations_JS.js",
    "560_Admin_Dormant_CRM_JS.js",
    "561_Admin_Master_Customer_JS.js",
    "562_Admin_User_Access_JS.js",
    "563_Admin_Master_Supplier_JS.js",
    "564_Admin_Tran_Sales_JS.js",
    "565_Admin_Tran_Pays_JS.js",
    "566_Admin_360_Modal_JS.js",
    "567_Admin_Notification_Manager_JS.js",
    "568_Admin_SysConfig_JS.js",
    "569_Admin_Handshake_JS.js",
    "570_Admin_Tran_Inventory_JS.js",
    "571_Admin_Dash_Inventory_JS.js",
    "580_1_Admin_DailySalesReports_JS.js",
    "580_2_Admin_Outstanding_JS.js",
    "580_3_Admin_Dormant_JS.js",
    "580_4_Admin_Sales_JS.js",
    "580_5_Admin_Pays_JS.js",
    "580_6_Admin_Orders_JS.js",
    "580_7_Admin_Delivery_JS.js",
    "580_9_Admin_CRM_Reports_JS.js",
    "581_0_Admin_Reports_Customer_JS.js",
    "581_1_Admin_Report_Week_JS.js",
    "590_Admin_Password_JS.js",
    "651_CRM_App_JS.js",
    "701_Accounts_App.js",
    "702_Accounts_Auth.js",
    "703_Accounts_Header.js",
    "704_Accounts_Sidebar.js",
    "705_Accounts_Maker.js",
    "706_Accounts_Checker.js",
    "707_Accounts_Maker_Auto.js"
  ];

  async function bootAdminShell() {
    const elements = document.querySelectorAll('[data-include]');
    await Promise.all(Array.from(elements).map(async (el) => {
      const file = el.getAttribute('data-include');
      try {
        const response = await fetch(file);
        if (response.ok) {
          let html = await response.text();
          el.outerHTML = html;
        } else {
          console.error("Failed to load structural view:", file);
        }
      } catch (e) {
        console.error("Network error fetching:", file);
      }
    }));

    for (const src of jsFiles) {
      await new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = resolve;
        script.onerror = () => {
          console.error("Failed to load script:", src);
          resolve();
        };
        document.body.appendChild(script);
      });
    }

    window.dispatchEvent(new Event('DOMContentLoaded'));
    window.dispatchEvent(new Event('load'));
    console.log("✅ WowDrops Core Shell Loaded! Awaiting Module Clicks...");
  }

  bootAdminShell();
</script>
</body>
</html>
