<div id="main-header"
    class="fixed top-0 left-0 right-0 z-50 glass-header px-4 py-2 flex justify-between items-center transition-all duration-300 border-b-2 border-slate-200 shadow-sm h-20">
    <div class="flex items-center gap-3">
        <button onclick="window.toggleSidebar()"
            class="relative z-50 p-2 -ml-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition outline-none shadow-sm bg-white border border-slate-200">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>
        <div id="header-brand-area" class="flex items-center fade-in">
            <a href="https://wowdrops.github.io/supabase" target="_blank" rel="noopener noreferrer"
                class="shrink-0 flex items-center">
                <img src="wowLogo.jpg" class="h-16 w-auto"
                    alt="Logo">
            </a>
        </div>
    </div>
    <div class="text-right hidden sm:flex items-center gap-4">
        <!-- NEW: Global CPN Search Bar -->
        <div class="relative group">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <input type="text" id="global-cpn-search" placeholder="Search CPN & Press Enter"
                onkeypress="window.handleGlobalCpnSearch(event)"
                class="w-56 pl-9 pr-3 py-1.5 text-sm font-bold text-slate-700 bg-slate-100 border border-slate-200 rounded-lg outline-none focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all uppercase placeholder-slate-400 placeholder:normal-case shadow-inner">
        </div>

        <!-- EXISTING: User Name Badge -->
        <p id="disp-admin-name"
            class="text-sm text-slate-600 font-bold bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">User:
            Pending</p>
    </div>
</div>
