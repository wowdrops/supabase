<div id="main-header"
    class="fixed top-0 left-0 right-0 z-50 glass-header px-2 md:px-4 py-2 flex justify-between items-center transition-all duration-300 border-b-2 border-slate-200 dark:border-slate-800 shadow-sm h-20 bg-white/90 dark:bg-slate-900/90">
    
    <!-- LEFT SIDE: Menu, Logo, Back Button -->
    <div class="flex items-center gap-1 md:gap-3">
        <button onclick="window.toggleSidebar()"
            class="relative z-50 p-1.5 md:p-2 md:-ml-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition outline-none shadow-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>
        
        <!-- The Logo (Shrinks on mobile to save space) -->
        <div id="header-brand-area" class="flex items-center fade-in">
            <a href="https://wowdrops.github.io/supabase" target="_blank" rel="noopener noreferrer" class="shrink-0 flex items-center">
                <img src="wowLogo.jpg" class="h-10 md:h-16 w-auto rounded-lg" alt="Logo">
            </a>
        </div>

        <!-- The clean Back Button (Hidden by Default) -->
        <button id="btn-back-dashboard" onclick="window.returnToDashboard()" class="hidden text-indigo-700 dark:text-indigo-300 hover:text-indigo-900 dark:hover:text-indigo-100 bg-indigo-50 dark:bg-indigo-900/50 hover:bg-indigo-100 dark:hover:bg-indigo-800/50 border border-indigo-200 dark:border-indigo-700 font-black text-xs md:text-lg flex items-center gap-1 md:gap-2 px-2 md:px-4 py-1.5 md:py-2 rounded-xl shadow-sm transition outline-none fade-in">
            <svg class="w-4 h-4 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span id="lbl-back-dashboard" class="hidden sm:inline">Back to Dashboard</span>
            <span class="sm:hidden">Back</span>
        </button>
    </div>

    <!-- RIGHT SIDE: Toggles, Search, Username (Now visible on mobile) -->
    <div class="text-right flex items-center gap-1 md:gap-3">
        
        <!-- UI PREFERENCES TOGGLES (Theme & Text Size) -->
        <div class="flex items-center gap-1 md:gap-2 mr-1 md:mr-2 border-r border-slate-200 dark:border-slate-700 pr-2 md:pr-4">
            <!-- Theme Toggle -->
            <button onclick="window.cycleThemeMode()" title="Toggle Dark Mode" id="btn-theme-toggle" class="p-1.5 md:p-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-lg transition outline-none">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            
            <!-- Font Size Toggle -->
            <button onclick="window.cycleFontSize()" title="Toggle Font Size" id="btn-font-toggle" class="p-1.5 md:p-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-lg transition outline-none flex items-center font-black">
                <span class="text-[10px] md:text-xs">A</span><span class="text-sm md:text-base ml-0.5">A</span>
            </button>
        </div>

        <!-- SEARCH: Hidden on mobile (smaller than md) to save space -->
        <div class="relative group hidden md:block">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <input type="text" id="global-cpn-search" placeholder="Search CPN & Press Enter"
                onkeypress="window.handleGlobalCpnSearch(event)"
                class="w-56 pl-9 pr-3 py-1.5 text-sm font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all uppercase placeholder-slate-400 dark:placeholder-slate-500 placeholder:normal-case shadow-inner">
        </div>
        
        <!-- USERNAME -->
        <p id="disp-admin-name"
            class="text-[9px] md:text-sm text-slate-600 dark:text-slate-300 font-bold bg-slate-100 dark:bg-slate-800 px-2 md:px-3 py-1 md:py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 max-w-[65px] md:max-w-none truncate">
            Pending
        </p>
    </div>
</div>
