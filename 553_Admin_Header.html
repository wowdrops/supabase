<div id="main-header"
    class="fixed top-0 left-0 right-0 z-50 glass-header px-3 md:px-6 py-2 flex justify-between items-center transition-all duration-300 border-b border-slate-200/60 dark:border-slate-800/60 shadow-sm h-16 md:h-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md">
    
    <!-- LEFT SIDE: Menu, Logo, Back Button -->
    <div class="flex items-center gap-3 md:gap-5">
        <!-- Sleek Borderless Hamburger -->
        <button onclick="window.toggleSidebar()"
            class="p-1.5 md:p-2 -ml-1 md:-ml-2 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors outline-none focus:ring-2 focus:ring-indigo-500">
            <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        
        <!-- Logo (Responsive for Mobile) -->
        <div id="header-brand-area" class="flex items-center fade-in">
            <a href="index.html" target="_blank" rel="noopener noreferrer" class="flex items-center">
                <img src="wowLogo.jpg" class="h-8 md:h-12 w-auto rounded-md shadow-sm" alt="Logo">
            </a>
        </div>

        <!-- Clean Pill-shaped Back Button -->
        <button id="btn-back-dashboard" onclick="window.returnToDashboard()" class="hidden text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/40 hover:bg-indigo-100 dark:hover:bg-indigo-800/60 font-bold text-xs md:text-sm flex items-center gap-1.5 px-3 md:px-4 py-1.5 md:py-2 rounded-full transition-colors outline-none fade-in shadow-sm">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span id="lbl-back-dashboard" class="hidden sm:inline">Back to Dashboard</span>
            <span class="sm:hidden">Back</span>
        </button>
    </div>

    <!-- RIGHT SIDE: UI Toggles, Search, User Badge -->
    <div class="flex items-center gap-2 md:gap-4">
        
        <!-- Grouped UI Preferences Pill (Native App Feel) -->
        <div class="flex items-center gap-1 bg-slate-100/80 dark:bg-slate-800/80 p-1 rounded-full border border-slate-200/60 dark:border-slate-700/60 shadow-inner">
            <!-- Theme Toggle -->
            <button onclick="window.cycleThemeMode()" title="Toggle Dark Mode" id="btn-theme-toggle" class="p-1.5 md:p-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-slate-700 rounded-full transition-all shadow-sm outline-none">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            
            <!-- Font Size Toggle -->
            <button onclick="window.cycleFontSize()" title="Toggle Font Size" id="btn-font-toggle" class="p-1.5 md:p-2 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-white dark:hover:bg-slate-700 rounded-full transition-all shadow-sm outline-none flex items-center justify-center font-black w-7 h-7 md:w-9 md:h-9">
                <span class="text-[10px] md:text-xs tracking-tighter">A</span><span class="text-sm md:text-base ml-0.5">A</span>
            </button>
        </div>

        <!-- Global Search (PC ONLY) -->
        <div class="relative group hidden md:block">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                <svg class="w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <input type="text" id="global-cpn-search" placeholder="Search CPN & Enter" onkeypress="window.handleGlobalCpnSearch(event)" class="w-48 lg:w-64 pl-9 pr-3 py-1.5 md:py-2 text-sm font-bold text-slate-700 dark:text-slate-200 bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-full outline-none focus:bg-white dark:focus:bg-slate-900 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all uppercase placeholder-slate-400 shadow-inner">
        </div>
        
        <!-- Premium User Avatar Badge -->
        <div class="flex items-center bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800/50 rounded-full pl-1 pr-3 md:pr-4 py-1 gap-1.5 md:gap-2 shadow-sm cursor-default">
            <div class="bg-indigo-500 text-white p-1 rounded-full flex-shrink-0">
                <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <p id="disp-admin-name" class="text-[10px] md:text-sm text-indigo-900 dark:text-indigo-200 font-bold max-w-[60px] md:max-w-[120px] truncate tracking-wide">
                Pending
            </p>
        </div>

    </div>
</div>
