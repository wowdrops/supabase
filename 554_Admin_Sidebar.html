<style>
  /* Clean, visible scrollbar for the sidebar navigation */
  .sidebar-scroll::-webkit-scrollbar {
    width: 6px;
  }
  .sidebar-scroll::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.4);
  }
  .sidebar-scroll::-webkit-scrollbar-thumb {
    background: rgba(100, 116, 139, 0.5);
    border-radius: 9999px;
  }
  .sidebar-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.8);
  }
  .sidebar-scroll {
    scrollbar-width: thin;
    scrollbar-color: rgba(100, 116, 139, 0.5) rgba(15, 23, 42, 0.4);

  <div class="flex-1 overflow-y-auto p-3 py-4 sidebar-scroll">

      <!-- Menus and Pages will be injected here by window.applyRolePermissions() -->
    </nav>

  <div class="p-4 border-t border-slate-800 dark:border-slate-900 space-y-1 shrink-0 bg-slate-900 dark:bg-slate-950 overflow-hidden transition-colors">

    <button onclick="window.logoutAdmin()"

      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
