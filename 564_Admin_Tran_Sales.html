<div id="tab-tran-sales-crud" class="hidden space-y-6 fade-in pb-20 relative h-full">
  
  <!-- STICKY TOP NAV -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 pb-4 sticky top-0 z-20 backdrop-blur pt-2 px-2">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-2xl md:text-3xl font-black uppercase tracking-wider text-slate-800 dark:text-indigo-400 transition-colors">Sales Management</h2>
        <p class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-1 transition-colors">Secure Transaction Records</p>
      </div>
      <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto items-center">
        <div class="flex gap-2 w-full md:w-auto bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-1.5 rounded-xl shadow-inner transition-colors">
          <input type="date" id="sc-flt-start" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-lg p-2 outline-none focus:ring-1 focus:ring-indigo-500 dark:[color-scheme:dark] transition-colors shadow-sm">
          <span class="text-slate-500 self-center font-black uppercase tracking-widest text-[10px]">to</span>
          <input type="date" id="sc-flt-end" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-lg p-2 outline-none focus:ring-1 focus:ring-indigo-500 dark:[color-scheme:dark] transition-colors shadow-sm">
          <button onclick="window.loadSalesCrudData()" class="bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-900 dark:hover:bg-indigo-800 text-indigo-700 dark:text-indigo-300 px-3 rounded-lg font-black text-xs transition-colors shadow-sm active:scale-95 uppercase tracking-widest outline-none">Fetch</button>
        </div>
        <button onclick="window.openSalesModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-2.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 outline-none uppercase tracking-widest text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
          Log Sale
        </button>
      </div>
    </div>
  </div>

  <div class="px-2 mt-4">
    <div class="bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-3xl shadow-xl overflow-hidden transition-colors">
      
      <!-- SPA STANDARD LOCAL SCROLLBOX (hide-scrollbar REMOVED) -->
      <div class="overflow-x-auto overflow-y-auto max-h-[70vh] w-full relative">
        <table class="w-full text-left border-collapse whitespace-nowrap text-slate-700 dark:text-slate-200 text-sm transition-colors">
          
          <thead class="sticky top-0 z-10 shadow-sm">
            
            <!-- Summary Row -->
            <tr class="bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 text-indigo-700 dark:text-indigo-300 text-[10px] md:text-xs font-black uppercase tracking-widest transition-colors">
              <td colspan="2" class="p-3 pl-6">Total Records: <span id="sum-records" class="text-slate-800 dark:text-white font-black bg-white dark:bg-slate-900 px-2 py-0.5 rounded shadow-sm">0</span></td>
              <td class="p-3 text-center text-slate-800 dark:text-white" id="sum-act-d">0</td>
              <td class="p-3 text-center text-amber-600 dark:text-amber-400" id="sum-act-e">0</td>
              <td class="p-3 text-right"></td>
              <td class="p-3 text-right text-emerald-600 dark:text-emerald-400 text-sm" id="sum-amount">₹0</td>
              <td colspan="2" class="p-3"></td>
            </tr>

            <!-- Original Column Headers -->
            <tr class="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 text-[10px] uppercase tracking-widest border-b-2 border-slate-200 dark:border-slate-800 transition-colors">
              <th class="p-4 pl-6">Customer</th>
              <th class="p-4">Del Date</th>
              <th class="p-4 text-center">Act D (Full)</th>
              <th class="p-4 text-center">Act E (Emp)</th>
              <th class="p-4 text-right">Rate</th>
              <th class="p-4 text-right text-emerald-600 dark:text-emerald-400">Amount</th>
              <th class="p-4">Delivery Comment</th>
              <th class="p-4 text-center">Actions</th>
            </tr>
          </thead>
          
          <tbody id="sales-crud-tbody" class="divide-y-2 divide-slate-100 dark:divide-slate-800/60 font-bold transition-colors">
            <tr><td colspan="8" class="text-center py-12 text-slate-400 font-bold uppercase tracking-widest">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Sales Modal Form -->
  <div id="sales-crud-modal" class="fixed inset-0 z-[200] bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-4 fade-in">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden text-slate-800 dark:text-slate-100 flex flex-col relative transition-colors">
      <div class="p-5 bg-slate-50 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center shadow-sm z-10 transition-colors">
        <h3 id="sales-modal-title" class="text-lg font-black uppercase text-indigo-700 dark:text-indigo-400 tracking-widest">New Sales Record</h3>
        <button onclick="window.closeModal('sales-crud-modal')" class="text-slate-400 hover:text-rose-500 transition outline-none"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
      </div>
      <!-- hide-scrollbar REMOVED from modal body as well -->
      <div class="p-6 space-y-4 overflow-y-auto max-h-[75vh] bg-white dark:bg-slate-900 transition-colors">
        <input type="hidden" id="sc-uniqueNo">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1 tracking-widest transition-colors">CPNNO *</label>
            <input type="text" id="sc-cpn" placeholder="CPN123" onblur="this.value=this.value.toUpperCase(); window.fetchCpnDefaultRate(this.value)" class="w-full p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 shadow-inner rounded-xl font-black uppercase text-slate-800 dark:text-white outline-none focus:border-indigo-400 transition-colors">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1 tracking-widest transition-colors">Del Date *</label>
            <input type="date" id="sc-delDate" class="w-full p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 shadow-inner rounded-xl font-black text-slate-800 dark:text-white outline-none focus:border-indigo-400 dark:[color-scheme:dark] transition-colors">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-indigo-500 dark:text-indigo-400 mb-1 tracking-widest transition-colors">Act D VJ (Validity Jar)</label>
            <input type="number" id="sc-vjFull" value="1" oninput="window.calcSalesAmt()" class="w-full p-3 bg-indigo-50 dark:bg-slate-950 border border-indigo-200 dark:border-slate-800 shadow-inner rounded-xl font-black text-slate-800 dark:text-white outline-none focus:border-indigo-500 transition-colors text-center">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-indigo-500 dark:text-indigo-400 mb-1 tracking-widest transition-colors">Act D NVJ (Non-VJ)</label>
            <input type="number" id="sc-nvjFull" value="0" oninput="window.calcSalesAmt()" class="w-full p-3 bg-indigo-50 dark:bg-slate-950 border border-indigo-200 dark:border-slate-800 shadow-inner rounded-xl font-black text-slate-800 dark:text-white outline-none focus:border-indigo-500 transition-colors text-center">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-amber-600 dark:text-amber-500 mb-1 tracking-widest transition-colors">Act E VJ</label>
            <input type="number" id="sc-vjEmp" value="1" class="w-full p-3 bg-amber-50 dark:bg-slate-950 border border-amber-200 dark:border-slate-800 shadow-inner rounded-xl font-black text-slate-800 dark:text-white outline-none focus:border-amber-500 transition-colors text-center">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-amber-600 dark:text-amber-500 mb-1 tracking-widest transition-colors">Act E NVJ</label>
            <input type="number" id="sc-nvjEmp" value="0" class="w-full p-3 bg-amber-50 dark:bg-slate-950 border border-amber-200 dark:border-slate-800 shadow-inner rounded-xl font-black text-slate-800 dark:text-white outline-none focus:border-amber-500 transition-colors text-center">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 border-t border-slate-200 dark:border-slate-800 pt-4 mt-2">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1 tracking-widest transition-colors">Rate (₹) *</label>
            <input type="number" id="sc-rate" value="40" oninput="window.calcSalesAmt()" class="w-full p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 shadow-inner rounded-xl font-black text-emerald-600 dark:text-emerald-400 outline-none focus:border-emerald-500 transition-colors">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1 tracking-widest transition-colors">Calculated Amount (₹)</label>
            <input type="text" id="sc-calcAmt" readonly class="w-full p-3 bg-emerald-50 dark:bg-slate-950/50 border border-emerald-200 dark:border-slate-800/80 shadow-inner rounded-xl font-black text-emerald-700 dark:text-emerald-400 cursor-not-allowed transition-colors text-lg">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1 tracking-widest transition-colors">Delivery Comment</label>
          <input type="text" id="sc-delComment" placeholder="Optional notes..." class="w-full p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 shadow-inner rounded-xl font-bold text-slate-800 dark:text-white outline-none focus:border-indigo-400 transition-colors">
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-500 dark:text-slate-400 mb-1 tracking-widest transition-colors">Door Delivery Photo URL / Link</label>
          <input type="text" id="sc-doorLink" placeholder="Drive Link..." class="w-full p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 shadow-inner rounded-xl font-bold text-slate-800 dark:text-white outline-none focus:border-indigo-400 transition-colors">
        </div>
      </div>
      <div class="p-5 bg-slate-50 dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 flex justify-end shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 transition-colors">
        <button onclick="window.submitSalesCrud()" id="sc-btn-save" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-xl transition shadow-lg uppercase tracking-widest text-sm active:scale-95 outline-none flex items-center justify-center gap-2">
           <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> Save Sales Record
        </button>
      </div>
    </div>
  </div>
</div>
