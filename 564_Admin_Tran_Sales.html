<div id="tab-tran-sales-crud" class="hidden space-y-6 fade-in pb-20">
  <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-white">
    <div>
      <h2 class="text-2xl md:text-3xl font-black uppercase tracking-wider text-indigo-400">Sales Management</h2>
      <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Secure Transaction Records</p>
    </div>
    <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto items-center">
      <div class="flex gap-2 w-full md:w-auto bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
        <input type="date" id="sc-flt-start" class="bg-slate-900 border-none text-slate-300 text-xs font-bold rounded-lg p-2 outline-none focus:ring-1 focus:ring-indigo-500 dark:[color-scheme:dark]">
        <span class="text-slate-500 self-center font-bold">to</span>
        <input type="date" id="sc-flt-end" class="bg-slate-900 border-none text-slate-300 text-xs font-bold rounded-lg p-2 outline-none focus:ring-1 focus:ring-indigo-500 dark:[color-scheme:dark]">
        <button onclick="window.loadSalesCrudData()" class="bg-indigo-900 hover:bg-indigo-800 text-indigo-300 px-3 rounded-lg font-black text-xs transition">Fetch</button>
      </div>
      <button onclick="window.openSalesModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-black px-5 py-2.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
        Log Sale
      </button>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- FIX: Added max-h-[70vh] and overflow-y-auto (WITHOUT hide-scrollbar) so you get a fast, draggable thumb! -->
    <div class="overflow-x-auto overflow-y-auto max-h-[70vh] w-full relative">
      <table class="w-full text-left border-collapse whitespace-nowrap text-slate-200 text-sm">
        
        <!-- FIX: Sticky top-0 now locks perfectly to the top of this localized scroll box -->
        <thead class="sticky top-0 z-20 shadow-md">
          
          <!-- Summary Row with solid bg-slate-800 -->
          <tr class="bg-slate-800 border-b border-slate-700 text-indigo-300 text-xs font-black">
            <td colspan="2" class="p-3 pl-4">Total Records: <span id="sum-records" class="text-white">0</span></td>
            <td class="p-3 text-center text-white" id="sum-act-d">0</td>
            <td class="p-3 text-center text-amber-400" id="sum-act-e">0</td>
            <td class="p-3 text-right"></td>
            <td class="p-3 text-right text-emerald-400 text-sm" id="sum-amount">₹0</td>
            <td colspan="2" class="p-3"></td>
          </tr>

          <!-- Original Column Headers with solid bg-slate-950 -->
          <tr class="bg-slate-950 text-slate-400 text-[10px] uppercase tracking-widest border-b border-slate-800">
            <th class="p-4">Customer</th>
            <th class="p-4">Del Date</th>
            <th class="p-4 text-center">Act D (Full)</th>
            <th class="p-4 text-center">Act E (Emp)</th>
            <th class="p-4 text-right">Rate</th>
            <th class="p-4 text-right text-emerald-400">Amount</th>
            <th class="p-4">Delivery Comment</th>
            <th class="p-4 text-center">Actions</th>
          </tr>
        </thead>
        
        <tbody id="sales-crud-tbody" class="divide-y divide-slate-800/60 font-bold">
          <!-- Injected via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Sales Modal Form -->
  <div id="sales-crud-modal" class="fixed inset-0 z-[200] bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden text-slate-100 flex flex-col">
      <div class="p-5 bg-slate-950 border-b border-slate-800 flex justify-between items-center">
        <h3 id="sales-modal-title" class="text-lg font-black uppercase text-indigo-400">New Sales Record</h3>
        <button onclick="window.closeSalesModal()" class="text-slate-400 hover:text-white text-2xl font-black outline-none">&times;</button>
      </div>
      <div class="p-6 space-y-4 overflow-y-auto max-h-[75vh] hide-scrollbar">
        <input type="hidden" id="sc-uniqueNo">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">CPNNO *</label>
            <input type="text" id="sc-cpn" placeholder="CPN123" onblur="window.fetchCpnDefaultRate(this.value)" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold uppercase text-white outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Del Date *</label>
            <input type="date" id="sc-delDate" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500 dark:[color-scheme:dark]">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Act D VJ (Validity Jar)</label>
            <input type="number" id="sc-vjFull" value="1" oninput="window.calcSalesAmt()" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Act D NVJ (Non-VJ)</label>
            <input type="number" id="sc-nvjFull" value="0" oninput="window.calcSalesAmt()" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Act E VJ</label>
            <input type="number" id="sc-vjEmp" value="1" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Act E NVJ</label>
            <input type="number" id="sc-nvjEmp" value="0" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Rate (₹) *</label>
            <input type="number" id="sc-rate" value="40" oninput="window.calcSalesAmt()" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-emerald-400 outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Calculated Amount (₹)</label>
            <input type="text" id="sc-calcAmt" readonly class="w-full p-3 bg-slate-950/50 border border-slate-800/80 rounded-xl font-black text-emerald-400 cursor-not-allowed">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Delivery Comment</label>
          <input type="text" id="sc-delComment" placeholder="Optional notes..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Door Delivery Photo URL / Link</label>
          <input type="text" id="sc-doorLink" placeholder="Drive Link..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-indigo-500">
        </div>
      </div>
      <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end">
        <button onclick="window.submitSalesCrud()" id="sc-btn-save" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl transition shadow-lg uppercase tracking-wider text-sm">Save Sales Record</button>
      </div>
    </div>
  </div>
</div>
<!-- Global Toast Notification Container -->
<div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
