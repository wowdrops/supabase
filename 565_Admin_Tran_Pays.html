<div id="tab-tran-pays-crud" class="hidden space-y-6 fade-in pb-20">
  <div
    class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 text-white">
    <div>
      <h2 class="text-2xl md:text-3xl font-black uppercase tracking-wider text-emerald-400">Payment Management</h2>
      <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Secure Financial Records (Ledger
        Synced)</p>
    </div>
    <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto items-center">
      <div class="flex gap-2 w-full md:w-auto bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
        <input type="date" id="pc-flt-start"
          class="bg-slate-900 border-none text-slate-300 text-xs font-bold rounded-lg p-2 outline-none focus:ring-1 focus:ring-emerald-500">
        <span class="text-slate-500 self-center font-bold">to</span>
        <input type="date" id="pc-flt-end"
          class="bg-slate-900 border-none text-slate-300 text-xs font-bold rounded-lg p-2 outline-none focus:ring-1 focus:ring-emerald-500">
        <button onclick="window.loadPaysCrudData()"
          class="bg-emerald-900 hover:bg-emerald-800 text-emerald-300 px-3 rounded-lg font-black text-xs transition">Fetch</button>
      </div>
      <button onclick="window.openPaysModal()"
        class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-black px-5 py-2.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path>
        </svg>
        Log Payment
      </button>
    </div>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
    <!-- FIX: Added max-h-[70vh] and overflow-y-auto so you get a fast, draggable thumb -->
    <div class="overflow-x-auto overflow-y-auto max-h-[70vh] w-full relative">
      <table class="w-full text-left border-collapse whitespace-nowrap text-slate-200 text-sm">

        <!-- FIX: Sticky top-0 locks to the top of this localized scroll box -->
        <thead class="sticky top-0 z-20 shadow-md">

          <!-- NEW: Summary Row with solid bg-slate-800 -->
          <tr class="bg-slate-800 border-b border-slate-700 text-indigo-300 text-xs font-black">
            <td colspan="3" class="p-3 pl-4">Total Records: <span id="sum-pay-records" class="text-white">0</span></td>
            <td class="p-3 text-right text-emerald-400 text-sm" id="sum-pay-amount">₹0</td>
            <td colspan="2" class="p-3"></td>
          </tr>

          <!-- Original Column Headers with solid bg-slate-950 -->
          <tr class="bg-slate-950 text-slate-400 text-[10px] uppercase tracking-widest border-b border-slate-800">
            <th class="p-4">Customer</th>
            <th class="p-4">Payment Date</th>
            <th class="p-4">Mode</th>
            <th class="p-4 text-right text-emerald-400">Amount</th>
            <th class="p-4">Remarks</th>
            <th class="p-4 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="pays-crud-tbody" class="divide-y divide-slate-800/60 font-bold">
          <!-- Injected via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pays Modal -->
  <div id="pays-crud-modal"
    class="fixed inset-0 z-[200] bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div
      class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden text-slate-100 flex flex-col">
      <div class="p-5 bg-slate-950 border-b border-slate-800 flex justify-between items-center">
        <h3 class="text-lg font-black uppercase text-emerald-400">Record Payment</h3>
        <button onclick="window.closePaysModal()"
          class="text-slate-400 hover:text-white text-2xl font-black outline-none">&times;</button>
      </div>
      <div class="p-6 space-y-4">
        <input type="hidden" id="pc-uniqueNo">
        <input type="hidden" id="pc-isEdit" value="false">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">CPNNO *</label>
          <input type="text" id="pc-cpn" placeholder="CPN123"
            class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold uppercase text-white outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Date *</label>
            <input type="date" id="pc-payDate"
              class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Amount (₹) *</label>
            <input type="number" id="pc-amount"
              class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-emerald-400 outline-none focus:border-emerald-500">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Payment Mode *</label>
          <select id="pc-mode"
            class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-emerald-500">
            <option value="ONLINE">ONLINE (Bank)</option>
            <option value="CASH">CASH</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Remark</label>
          <input type="text" id="pc-remark" placeholder="Transaction ref or note..."
            class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl font-bold text-white outline-none focus:border-emerald-500">
        </div>
      </div>
      <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end">
        <button onclick="window.submitPaysCrud()" id="pc-btn-save"
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl transition shadow-lg uppercase tracking-wider text-sm">Save
          & Sync Ledger</button>
      </div>
    </div>
  </div>
</div>
