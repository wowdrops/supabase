<div id="admin-360-modal" class="fixed inset-0 z-[300] bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center p-2 md:p-6 fade-in transition-colors">
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-4xl max-h-[92vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden text-slate-800 dark:text-slate-100 transition-colors">
    
    <!-- Modal Header -->
    <div class="p-4 md:p-6 bg-slate-50 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center shrink-0 shadow-sm transition-colors">

        <h3 class="text-xl md:text-2xl font-black text-indigo-700 dark:text-indigo-400 uppercase tracking-widest transition-colors">Customer 360 View</h3>
        <span id="modal-360-timer" class="bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-lg shadow-inner transition-colors">0.00s</span>

      <button onclick="window.closeModal('admin-360-modal')" class="text-slate-400 hover:text-rose-500 transition p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-rose-200 rounded-xl font-black text-xl leading-none outline-none shadow-sm">&times;</button>

    <!-- Dynamic Content Container -->
    <div id="modal-360-content" class="p-4 md:p-6 overflow-y-auto space-y-4 flex-1 bg-white dark:bg-slate-900 transition-colors">

    </div>
    
  </div>
