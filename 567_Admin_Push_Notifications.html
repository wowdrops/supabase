<div id="tab-push-notifications" class="hidden space-y-4 fade-in pb-20 relative">

  <!-- Sticky Header with Timer & Collapse Button -->
  <div class="sticky top-0 z-30 bg-slate-50/95 backdrop-blur border-b-4 border-indigo-300 pt-2 pb-4">
    <div class="flex justify-between items-center px-2">
      <h2 class="text-xl md:text-3xl font-black text-slate-800 tracking-tight uppercase flex items-center gap-3">
        Notification <span class="hidden md:inline"> Manager</span>
        <span id="notif-live-timer" class="hidden"></span>
        <button onclick="window.toggleNotifHeader()"
          class="text-slate-500 hover:text-slate-800 transition p-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg shadow-inner outline-none">
          <svg id="notif-header-icon" class="w-5 h-5 transition-transform duration-300 rotate-180" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path>
          </svg>
        </button>
      </h2>
    </div>

    <!-- Collapsible Tools Area -->
    <div id="notif-header-collapsible" class="transition-all duration-300 origin-top">
      
      <!-- Summary Badges -->
      <div class="flex items-center gap-2 md:gap-4 flex-wrap px-2 mt-4">
        <span class="text-[10px] md:text-xs font-black bg-slate-200 text-slate-600 px-2.5 py-1.5 rounded-lg uppercase tracking-widest">Total Sent: <b id="notif-count-total" class="text-slate-900">0</b></span>
        <span class="text-[10px] md:text-xs font-black bg-indigo-100 text-indigo-700 px-2.5 py-1.5 rounded-lg uppercase tracking-widest">Process: <b id="notif-count-process" class="text-indigo-900">0</b></span>
        <span class="text-[10px] md:text-xs font-black bg-emerald-100 text-emerald-700 px-2.5 py-1.5 rounded-lg uppercase tracking-widest">Completed: <b id="notif-count-completed" class="text-emerald-900">0</b></span>
        <span class="text-[10px] md:text-xs font-black bg-amber-100 text-amber-700 px-2.5 py-1.5 rounded-lg uppercase tracking-widest">Reminders: <b id="notif-count-reminders" class="text-amber-900">0</b></span>
      </div>

      <!-- Filters & Broadcast Action -->
      <div class="px-2 mt-4 flex flex-col lg:flex-row gap-4">
        
        <!-- Date Filters & Manual Trigger -->
        <div class="flex-1 bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3 justify-between">
          
          <!-- ⚡ MANUAL OVERRIDE BUTTONS (Side-by-Side) -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full pb-2 border-b border-slate-100">
             
             <!-- Button 1: Queue Reminders -->
             <button onclick="window.triggerManualOrderReminders()" id="btn-manual-reminders" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-black px-4 py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2 text-[10px] md:text-xs uppercase tracking-widest outline-none">
               <svg class="w-4 h-4 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
               <span class="truncate">Trigger Order Reminders</span>
             </button>

             <!-- Button 2: Force Dispatch Queue -->
             <button onclick="window.forceDispatchQueue()" id="btn-force-queue" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-black px-4 py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2 text-[10px] md:text-xs uppercase tracking-widest outline-none">
               <svg class="w-4 h-4 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
               <span class="truncate">Process Queue Now</span>
             </button>

          </div>
          
          <div class="flex flex-col md:flex-row gap-3 items-end">
            <div class="w-full">
              <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-1">From Date</label>
              <input type="date" id="notif-flt-from" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-indigo-500">
            </div>
            <div class="w-full">
              <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-1">To Date</label>
              <input type="date" id="notif-flt-to" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-indigo-500">
            </div>
            <button onclick="window.loadNotificationLogs()" class="w-full md:w-auto bg-slate-800 hover:bg-slate-900 text-white font-black px-6 py-2.5 rounded-xl transition shadow">Search</button>
          </div>
        </div>

        <!-- Admin Broadcast Tool -->
        <div class="flex-1 bg-amber-50 p-3 rounded-xl border border-amber-200 shadow-inner flex flex-col gap-2">
          <label class="text-[9px] font-black text-amber-800 uppercase tracking-widest">📢 Send Mass Broadcast (To all subscribed users)</label>
          <input type="text" id="notif-broadcast-title" placeholder="Message Title (e.g. 🌧️ Rain Delay)" class="w-full p-2 bg-white border border-amber-300 rounded-lg font-bold text-sm outline-none focus:border-amber-500">
          <textarea id="notif-broadcast-msg" rows="2" placeholder="Type your message here..." class="w-full p-2 bg-white border border-amber-300 rounded-lg text-sm font-medium outline-none focus:border-amber-500 resize-none"></textarea>
          <button onclick="window.queueAdminBroadcast()" class="bg-amber-600 hover:bg-amber-700 text-white font-black px-4 py-2 rounded-lg transition shadow-md w-full uppercase text-xs tracking-widest">Queue Broadcast to All</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Frozen Header Table Container -->
  <div class="px-2 w-full">
    <div class="bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden relative" style="max-height: 65vh;">
      <div class="overflow-y-auto w-full h-full custom-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead class="bg-indigo-100 text-indigo-900 text-[10px] uppercase tracking-widest sticky top-0 z-20 shadow-sm">
            <tr>
              <th class="p-3 border-b border-indigo-200">Timestamp</th>
              <th class="p-3 border-b border-indigo-200">CPN</th>
              <th class="p-3 border-b border-indigo-200">Category</th>
              <th class="p-3 border-b border-indigo-200">Title & Message</th>
              <th class="p-3 border-b border-indigo-200 text-center">Status</th>
            </tr>
          </thead>
          <tbody id="notif-logs-table" class="divide-y divide-slate-100 text-xs">
            <!-- Data populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
