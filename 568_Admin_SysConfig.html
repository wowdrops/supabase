<div id="tab-sys-config" class="hidden space-y-4 fade-in pb-20 relative h-full">
  <!-- Sticky Header -->
  <div class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800 pt-2 pb-4 transition-colors">
    <div class="flex justify-between items-center px-4">
      <div>
        <h2 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-cyan-400 tracking-tight uppercase transition-colors">
          System Config
        </h2>
        <p class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-1 transition-colors">Dynamic Database Parameters</p>
      </div>
      <span id="sys-live-timer" class="hidden"></span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="px-2 md:px-4 w-full max-w-7xl mx-auto mt-4 pb-10">
    <div class="flex justify-between items-end mb-6 px-2 border-b border-slate-200 dark:border-slate-800 pb-4">
      <h3 class="text-sm font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">Configuration Modules</h3>
      <button onclick="window.addNewSysConfig()" class="bg-cyan-100 text-cyan-800 dark:bg-cyan-900/50 dark:text-cyan-300 hover:bg-cyan-200 dark:hover:bg-cyan-800 font-bold px-4 py-2 rounded-lg text-xs uppercase tracking-widest transition-colors outline-none shadow-sm flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
        Add New Parameter
      </button>
    </div>

    <!-- ⚡ THIS IS WHERE THE DYNAMIC SECTIONS WILL INJECT -->
    <div id="sys-dynamic-container" class="space-y-10 relative min-h-[50vh]">
        
        <!-- Overlay loader -->
        <div id="sys-config-loader" class="absolute inset-0 bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center rounded-3xl transition-colors">
          <svg class="w-10 h-10 text-cyan-500 animate-spin mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <p class="text-xs font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">Processing Data...</p>
        </div>

    </div>

    <!-- Global Save Footer -->
    <div class="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3 shrink-0">
        <button onclick="window.loadSysConfig()" class="px-6 py-3 rounded-xl font-black uppercase tracking-widest text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-[10px] outline-none">Discard Changes</button>
        <button onclick="window.saveSysConfig()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-black px-8 py-3 rounded-xl shadow-lg transition text-[11px] uppercase tracking-widest active:scale-95 flex items-center gap-2 outline-none">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> 
          Save Global Config
        </button>
    </div>
  </div>
</div>
