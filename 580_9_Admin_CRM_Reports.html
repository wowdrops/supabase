<div id="tab-crm-reports" class="hidden fade-in space-y-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b-4 border-indigo-200 dark:border-indigo-800 pb-4 transition-colors">
    <h2 class="text-3xl md:text-4xl font-black text-slate-800 dark:text-white uppercase tracking-tight">CRM Analytics</h2>
    
    <div class="flex flex-col sm:flex-row items-center gap-2 bg-white dark:bg-slate-800 p-2 rounded-xl shadow-sm border-2 border-slate-200 dark:border-slate-700 transition-colors w-full md:w-auto">
      <input type="date" id="crm-rep-start" class="p-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded font-bold text-slate-600 dark:text-slate-300 outline-none color-scheme-dark transition-colors w-full sm:w-auto">
      <span class="font-black text-slate-400 dark:text-slate-500">TO</span>
      <input type="date" id="crm-rep-end" class="p-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded font-bold text-slate-600 dark:text-slate-300 outline-none color-scheme-dark transition-colors w-full sm:w-auto">
      <button onclick="window.generateDormantConversionReport()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-black px-6 py-2 rounded-lg transition w-full sm:w-auto">Analyze</button>
    </div>
  </div>

  <div id="crm-rep-loading" class="hidden text-center py-12 text-2xl font-black text-indigo-400 dark:text-indigo-500 animate-pulse transition-colors">Crunching Data...</div>

  <div id="crm-rep-content" class="hidden space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border-4 border-slate-200 dark:border-slate-700 shadow-xl transition-colors">
          <p class="text-sm font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest">Total Calls Completed</p>
          <p id="crm-rep-total" class="text-5xl font-black text-slate-800 dark:text-white mt-2">0</p>
      </div>

      <div class="bg-rose-50 dark:bg-rose-900/20 p-6 rounded-3xl border-4 border-rose-200 dark:border-rose-800 shadow-xl transition-colors">
          <p class="text-sm font-black text-rose-500 dark:text-rose-400 uppercase tracking-widest">Active &rarr; Inactive</p>
          <p id="crm-rep-lost" class="text-5xl font-black text-rose-700 dark:text-rose-400 mt-2">0</p>
      </div>

      <div class="bg-indigo-50 dark:bg-indigo-900/20 p-6 rounded-3xl border-4 border-indigo-200 dark:border-indigo-800 shadow-xl transition-colors">
          <p class="text-sm font-black text-indigo-500 dark:text-indigo-400 uppercase tracking-widest">Current Pending Queue</p>
          <p id="crm-rep-pending" class="text-5xl font-black text-indigo-700 dark:text-indigo-400 mt-2">0</p>
      </div>
      
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white dark:bg-slate-800 rounded-3xl border-4 border-slate-200 dark:border-slate-700 shadow-xl p-6 transition-colors">
         <h3 class="font-black text-slate-700 dark:text-slate-200 uppercase tracking-widest mb-4">Customers Marked Inactive</h3>
         <div id="crm-rep-lost-list" class="space-y-3 max-h-64 overflow-y-auto pr-2 hide-scrollbar"></div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-3xl border-4 border-slate-200 dark:border-slate-700 shadow-xl p-6 transition-colors">
         <h3 class="font-black text-slate-700 dark:text-slate-200 uppercase tracking-widest mb-4">Reasons for Dormancy</h3>
         <div id="crm-rep-reasons" class="space-y-3"></div>
      </div>
    </div>
  </div>
</div>
