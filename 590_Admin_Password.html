<div id="tab-password" class="hidden fade-in space-y-8 pb-12 transition-colors">
  <h2 class="text-3xl md:text-4xl font-black text-slate-800 dark:text-white border-b-4 border-slate-200 dark:border-slate-700 pb-4 tracking-tight uppercase transition-colors">Security Settings</h2>
  
  <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl border-4 border-slate-200 dark:border-slate-700 shadow-xl max-w-md space-y-6 transition-colors">
    
    <div>
      <label class="block text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest transition-colors">Current Password</label>
      <input type="password" id="cp-current" class="w-full mt-2 p-4 bg-slate-50 dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-600 rounded-xl outline-none font-bold text-slate-900 dark:text-white text-xl focus:ring-2 focus:ring-blue-600 dark:focus:ring-blue-500 transition-colors">
    </div>
    
    <div>
      <label class="block text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest transition-colors">New Password</label>
      <input type="password" id="cp-new" class="w-full mt-2 p-4 bg-slate-50 dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-600 rounded-xl outline-none font-bold text-slate-900 dark:text-white text-xl focus:ring-2 focus:ring-blue-600 dark:focus:ring-blue-500 transition-colors">
    </div>
    
    <div>
      <label class="block text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest transition-colors">Confirm New Password</label>
      <input type="password" id="cp-confirm" class="w-full mt-2 p-4 bg-slate-50 dark:bg-slate-900 border-2 border-slate-300 dark:border-slate-600 rounded-xl outline-none font-bold text-slate-900 dark:text-white text-xl focus:ring-2 focus:ring-blue-600 dark:focus:ring-blue-500 transition-colors">
    </div>
    
    <button onclick="window.updatePasswordInternal()" id="btn-change-pass" class="w-full bg-slate-800 dark:bg-blue-600 hover:bg-slate-900 dark:hover:bg-blue-700 text-white font-black p-4 text-xl rounded-xl shadow-lg transition-colors active:scale-95">Save Password</button>
    
    <p id="cp-msg" class="text-lg text-center font-bold hidden p-3 rounded-xl border-2 transition-colors"></p>
  </div>
</div>
