<!-- CRM WORKSPACE PARTIAL -->
<div id="tab-crm-workspace" class="hidden p-4 md:p-8 fade-in h-full pb-20">

  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl md:text-3xl font-black text-slate-800 uppercase tracking-widest">Telecaller Workspace</h1>
  </header>

  <div class="flex space-x-3 mb-6 overflow-x-auto pb-2 hide-scrollbar w-full border-b border-slate-200">
    <button onclick="window.crmSwitchTab('pending')" id="tab-pending"
      class="px-5 py-2.5 bg-indigo-600 text-white font-black rounded-t-xl text-sm uppercase tracking-widest transition whitespace-nowrap">Fresh
      Leads</button>
    <button onclick="window.crmSwitchTab('wip')" id="tab-wip"
      class="px-5 py-2.5 bg-transparent text-slate-500 font-black rounded-t-xl text-sm uppercase tracking-widest hover:bg-slate-100 transition whitespace-nowrap">Follow-up</button>
    <button onclick="window.crmSwitchTab('completed')" id="tab-completed"
      class="px-5 py-2.5 bg-transparent text-slate-500 font-black rounded-t-xl text-sm uppercase tracking-widest hover:bg-slate-100 transition whitespace-nowrap">Completed
      Logs</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- LEFT PANEL: MY QUEUE -->
    <div class="col-span-1 bg-white p-6 rounded-3xl shadow-xl border-4 border-slate-200 h-fit">
      <h3 id="queue-title"
        class="font-black text-slate-700 mb-4 uppercase tracking-widest border-b-2 border-slate-100 pb-2">My Queue</h3>

      <div class="flex flex-col gap-3 mb-4">
        <input type="text" id="queue-search" onkeyup="window.crmApplyQueueFilters()" placeholder="Search CPN or Name..."
          class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm focus:border-indigo-500 shadow-inner">
        <div class="flex gap-2">
          <button onclick="window.crmSortQueue('cpn-asc')"
            class="flex-1 text-[10px] font-black uppercase tracking-widest bg-slate-100 hover:bg-slate-200 py-2 rounded-lg border border-slate-200 text-slate-600 transition">A-Z</button>
          <button onclick="window.crmSortQueue('cpn-desc')"
            class="flex-1 text-[10px] font-black uppercase tracking-widest bg-slate-100 hover:bg-slate-200 py-2 rounded-lg border border-slate-200 text-slate-600 transition">Z-A</button>
          <button id="btn-sort-metric" onclick="window.crmSortQueue('metric')"
            class="flex-1 text-[10px] font-black uppercase tracking-widest bg-indigo-50 hover:bg-indigo-100 py-2 rounded-lg border border-indigo-200 text-indigo-700 transition">Highest
            Days</button>
        </div>
      </div>

      <div id="queue-list" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2 hide-scrollbar"></div>
    </div>

    <!-- RIGHT PANEL: INLINE 360 & INTERACTION FORM -->
    <div id="customer-360-view"
      class="col-span-1 md:col-span-2 bg-indigo-50 p-6 md:p-8 rounded-3xl shadow-xl border-4 border-indigo-200 hidden flex flex-col h-fit">

      <div class="flex items-center justify-between border-b-2 border-indigo-200 pb-4 mb-4">
        <h2 id="crm-header-title" class="text-2xl md:text-3xl font-black text-indigo-900 tracking-tight">Select a Lead
        </h2>
        <button onclick="document.getElementById('customer-360-view').classList.add('hidden')"
          class="text-indigo-400 hover:text-indigo-600 text-xl font-black transition">&times;</button>
      </div>

      <!-- Inline Profile Data Injected Here -->
      <div id="crm-inline-profile" class="mb-6"></div>

      <!-- Telecaller Interaction Form -->
      <div id="crm-interaction-form" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <!-- NEW: Interaction Header with Dynamic Quick Close Button -->
        <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
          <h4 class="font-black text-slate-800 uppercase tracking-widest text-sm">Log Interaction</h4>
          <button id="crm-quick-close-btn"
            onclick="window.quickCloseInteraction(document.getElementById('crm-hidden-cpn').value)"
            class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-black px-4 py-2 rounded-lg text-xs transition active:scale-95 shadow-md uppercase tracking-widest">Mark
            Self-Activated</button>
        </div>
        <input type="hidden" id="crm-hidden-cpn">
        <input type="hidden" id="crm-hidden-prev-status">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Call
              Status</label>
            <select id="crm-call-status"
              class="w-full p-3 rounded-xl border border-slate-300 font-bold text-sm outline-none focus:border-indigo-500 bg-slate-50"></select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Master Customer
              Status</label>
            <select id="crm-cust-status"
              class="w-full p-3 rounded-xl border border-slate-300 font-bold text-sm outline-none focus:border-indigo-500 bg-slate-50"></select>
          </div>
          <div class="col-span-1 md:col-span-2">
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Reason /
              Category</label>
            <select id="crm-dorm-reason"
              class="w-full p-3 rounded-xl border border-slate-300 font-bold text-sm outline-none focus:border-indigo-500 bg-slate-50"></select>
          </div>
        </div>

        <textarea id="crm-remark" placeholder="Enter detailed call notes here..."
          class="w-full p-4 rounded-xl border border-slate-300 mb-4 font-bold text-sm outline-none focus:border-indigo-500 h-24 shadow-inner bg-slate-50"></textarea>

        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
          <label class="flex items-center cursor-pointer group">
            <input type="checkbox" id="crm-admin-escalate"
              class="w-5 h-5 text-indigo-600 bg-slate-100 border-slate-300 rounded cursor-pointer accent-rose-500">
            <span
              class="ml-2 text-xs font-black text-rose-500 uppercase tracking-widest group-hover:text-rose-600 transition">Flag
              for Admin Review</span>
          </label>
          <button onclick="window.crmSubmitInteraction()" id="btn-save-interaction"
            class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 transition active:scale-95 text-white font-black px-8 py-3.5 rounded-xl shadow-lg uppercase tracking-widest text-sm">Save
            Log</button>
        </div>
      </div>

    </div>
  </div>
</div>
