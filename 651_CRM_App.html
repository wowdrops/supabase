<!-- CRM WORKSPACE PARTIAL -->
<div id="tab-crm-workspace" class="hidden p-4 md:p-8 fade-in h-full pb-20 relative">

  <!-- STICKY HEADER -->
  <header class="flex justify-between items-center mb-6 sticky top-0 z-10 bg-slate-50/95 dark:bg-slate-900/95 backdrop-blur pt-2 pb-4 border-b border-slate-200 dark:border-slate-800 transition-colors">
    <h1 class="text-2xl md:text-3xl font-black text-slate-800 dark:text-white uppercase tracking-widest transition-colors">Telecaller Workspace</h1>
    <button onclick="window.crmLoadQueues()" class="bg-indigo-100 dark:bg-indigo-900/40 hover:bg-indigo-200 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-400 px-4 py-2 rounded-xl text-sm font-black shadow-sm transition-colors active:scale-95 flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      <span class="hidden sm:inline">Refresh Queue</span>
    </button>
  </header>

  <div class="flex space-x-3 mb-6 overflow-x-auto pb-2 hide-scrollbar w-full border-b border-slate-200 dark:border-slate-800 transition-colors">
    <button onclick="window.crmSwitchTab('pending')" id="tab-pending"
      class="px-5 py-2.5 bg-indigo-600 dark:bg-indigo-700 text-white font-black rounded-t-xl text-sm uppercase tracking-widest transition-colors whitespace-nowrap">Fresh
      Leads</button>
    <button onclick="window.crmSwitchTab('wip')" id="tab-wip"
      class="px-5 py-2.5 bg-transparent text-slate-500 dark:text-slate-400 font-black rounded-t-xl text-sm uppercase tracking-widest hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors whitespace-nowrap">Follow-up</button>
    <button onclick="window.crmSwitchTab('completed')" id="tab-completed"
      class="px-5 py-2.5 bg-transparent text-slate-500 dark:text-slate-400 font-black rounded-t-xl text-sm uppercase tracking-widest hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors whitespace-nowrap">Completed
      Logs</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- LEFT PANEL: MY QUEUE -->
    <div class="col-span-1 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl border-4 border-slate-200 dark:border-slate-700 h-fit transition-colors">
      <div class="flex justify-between items-center border-b-2 border-slate-100 dark:border-slate-700 pb-2 mb-4 transition-colors">
        <h3 id="queue-title" class="font-black text-slate-700 dark:text-slate-200 uppercase tracking-widest transition-colors">My Queue</h3>
        <span id="queue-count-badge" class="bg-indigo-100 dark:bg-indigo-900/40 text-indigo-800 dark:text-indigo-400 text-xs font-black px-2 py-1 rounded-lg transition-colors">0</span>
      </div>

      <div class="flex flex-col gap-3 mb-4">
        <input type="text" id="queue-search" onkeyup="window.crmApplyQueueFilters()" placeholder="Search CPN or Name..."
          class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl outline-none font-bold text-slate-900 dark:text-white text-sm focus:border-indigo-500 dark:focus:border-indigo-400 shadow-inner transition-colors">
        <div class="flex gap-2">
          <button onclick="window.crmSortQueue('cpn-asc')"
            class="flex-1 text-[10px] font-black uppercase tracking-widest bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-700 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 transition-colors shadow-sm">A-Z</button>
          <button onclick="window.crmSortQueue('cpn-desc')"
            class="flex-1 text-[10px] font-black uppercase tracking-widest bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-700 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 transition-colors shadow-sm">Z-A</button>
          <button id="btn-sort-metric" onclick="window.crmSortQueue('metric')"
            class="flex-1 text-[10px] font-black uppercase tracking-widest bg-indigo-50 dark:bg-indigo-900/30 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 py-2 rounded-lg border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-400 transition-colors shadow-sm">Highest
            Days</button>
        </div>
      </div>

      <div id="queue-list" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2 hide-scrollbar transition-colors">
         <div class="text-center py-10 font-bold text-indigo-400 dark:text-indigo-500 animate-pulse uppercase tracking-widest">Loading Queue...</div>
      </div>
    </div>

    <!-- RIGHT PANEL: INLINE 360 & INTERACTION FORM -->
    <div id="customer-360-view"
      class="col-span-1 md:col-span-2 bg-indigo-50 dark:bg-slate-800 p-6 md:p-8 rounded-3xl shadow-xl border-4 border-indigo-200 dark:border-slate-700 hidden flex flex-col h-fit relative fade-in transition-colors">

      <div class="flex items-center justify-between border-b-2 border-indigo-200 dark:border-slate-700 pb-4 mb-4 transition-colors">
        <h2 id="crm-header-title" class="text-2xl md:text-3xl font-black text-indigo-900 dark:text-indigo-400 tracking-tight transition-colors">Select a Lead
        </h2>
        <button onclick="document.getElementById('customer-360-view').classList.add('hidden')"
          class="text-indigo-400 hover:text-rose-500 text-3xl font-black transition-colors leading-none outline-none">&times;</button>
      </div>

      <!-- Inline Profile Data Injected Here -->
      <div id="crm-inline-profile" class="mb-6 transition-colors"></div>

      <!-- Telecaller Interaction Form -->
      <div id="crm-interaction-form" class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 relative transition-colors">
        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4 transition-colors">
          <h4 class="font-black text-slate-800 dark:text-white uppercase tracking-widest text-sm flex items-center gap-2 transition-colors">
             <svg class="w-5 h-5 text-indigo-500 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
             Log Interaction
          </h4>
          <button id="crm-quick-close-btn"
            onclick="window.quickCloseInteraction(document.getElementById('crm-hidden-cpn').value)"
            class="hidden bg-emerald-50 dark:bg-emerald-900/30 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 font-black px-4 py-2 rounded-lg text-xs transition-colors active:scale-95 shadow-sm uppercase tracking-widest">Mark
            Self-Activated</button>
        </div>
        <input type="hidden" id="crm-hidden-cpn">
        <input type="hidden" id="crm-hidden-prev-status">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1 transition-colors">Call
              Status</label>
            <select id="crm-call-status"
              class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 font-bold text-sm outline-none focus:border-indigo-500 dark:focus:border-indigo-400 bg-slate-50 dark:bg-slate-800 shadow-inner text-slate-700 dark:text-white color-scheme-dark transition-colors">
               <option value="">Loading...</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1 transition-colors">Master Customer
              Status</label>
            <select id="crm-cust-status"
              class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 font-bold text-sm outline-none focus:border-indigo-500 dark:focus:border-indigo-400 bg-slate-50 dark:bg-slate-800 shadow-inner text-slate-700 dark:text-white color-scheme-dark transition-colors">
               <option value="">Loading...</option>
            </select>
          </div>
          <div class="col-span-1 md:col-span-2">
            <label class="block text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1 transition-colors">Reason /
              Category</label>
            <select id="crm-dorm-reason"
              class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 font-bold text-sm outline-none focus:border-indigo-500 dark:focus:border-indigo-400 bg-slate-50 dark:bg-slate-800 shadow-inner text-slate-700 dark:text-white color-scheme-dark transition-colors">
               <option value="">Loading...</option>
            </select>
          </div>
        </div>

        <textarea id="crm-remark" placeholder="Enter detailed call notes here..."
          class="w-full p-4 rounded-xl border border-slate-300 dark:border-slate-600 mb-4 font-bold text-sm outline-none focus:border-indigo-500 dark:focus:border-indigo-400 h-24 shadow-inner bg-slate-50 dark:bg-slate-800 placeholder-slate-400 dark:placeholder-slate-500 text-slate-800 dark:text-white transition-colors"></textarea>

        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between border-t border-slate-100 dark:border-slate-800 pt-4 transition-colors">
          <label class="flex items-center cursor-pointer group">
            <input type="checkbox" id="crm-admin-escalate"
              class="w-5 h-5 text-indigo-600 dark:text-indigo-500 bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-600 rounded cursor-pointer accent-rose-500 shadow-sm transition-colors">
            <span
              class="ml-2 text-xs font-black text-rose-500 dark:text-rose-400 uppercase tracking-widest group-hover:text-rose-600 dark:group-hover:text-rose-300 transition-colors">Flag
              for Admin Review</span>
          </label>
          <button onclick="window.crmSubmitInteraction()" id="btn-save-interaction"
            class="w-full sm:w-auto bg-indigo-600 dark:bg-indigo-700 hover:bg-indigo-700 dark:hover:bg-indigo-600 transition-colors active:scale-95 text-white font-black px-8 py-3.5 rounded-xl shadow-lg uppercase tracking-widest text-sm flex justify-center items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
            Save Log
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
