<!-- 752_Accounts_Auth.html -->
<div id="view-login" class="p-4 pt-16 fade-in min-h-screen flex flex-col justify-center bg-slate-100">
  <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md mx-auto border border-slate-300">
    
    <div class="text-center flex flex-col items-center mb-6 border-b border-slate-200 pb-6">
      <!-- Sharper container for the logo -->
      <div class="w-20 h-20 bg-slate-50 flex items-center justify-center mb-4 border border-slate-200 p-2 rounded-md shadow-inner">
        <img src="wowLogo.jpg" class="w-full h-full object-contain" alt="WOWDROPS">
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Finance & Ledger</h2>
      <p class="text-slate-500 text-[10px] mt-2 font-bold tracking-widest uppercase">Secure Authorization Required</p>
    </div>
    
    <div class="space-y-4">
      <div id="login-error" class="hidden text-center text-xs font-bold bg-red-50 text-red-700 border border-red-200 p-3 rounded-md shadow-sm"></div>
      
      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Username / Email</label>
        <input type="text" id="login-user" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-md outline-none font-semibold text-slate-900 focus:border-teal-600 focus:ring-1 focus:ring-teal-600 transition shadow-inner">
      </div>
      
      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Password</label>
        <input type="password" id="login-pass" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-md outline-none font-semibold text-slate-900 focus:border-teal-600 focus:ring-1 focus:ring-teal-600 transition shadow-inner">
      </div>
      
      <button onclick="window.handleAccountsLogin()" id="btn-login" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold text-sm py-3.5 rounded-md shadow transition active:scale-[0.98] mt-6 flex justify-center items-center gap-2 tracking-widest uppercase">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        Authenticate
      </button>
    </div>

  </div>
</div>
