<!-- 756_Accounts_Checker.html -->
<div id="tab-checker-approvals" class="accounts-tab-view hidden space-y-4 fade-in pb-20 relative max-w-7xl mx-auto">
  
  <!-- STICKY HEADER (Matches Delivery QC Pattern) -->
  <div class="sticky top-0 z-40 bg-slate-50/95 backdrop-blur border-b-4 border-indigo-200 pt-2 pb-4">
    <div class="flex justify-between items-center px-2">
      <h2 class="text-xl md:text-3xl font-black text-slate-800 tracking-tight uppercase flex items-center gap-3">
        Pending Approvals <span class="hidden md:inline"> - Checker</span>
        <span id="chk-live-timer" class="hidden"></span>
        <button onclick="window.toggleChkHeader()" class="text-slate-500 hover:text-slate-800 transition p-1.5 bg-slate-200 hover:bg-slate-300 rounded-lg shadow-inner outline-none">
          <svg id="chk-header-icon" class="w-5 h-5 transition-transform duration-300 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path></svg>
        </button>
      </h2>
    </div>

    <!-- COLLAPSIBLE HEADER SECTION -->
    <div id="chk-header-collapsible" class="transition-all duration-300 origin-top">
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 px-2 mt-4">
          <div class="flex items-center gap-2 md:gap-4 flex-wrap">
              <span class="text-[10px] md:text-xs font-black bg-slate-200 text-slate-600 px-2.5 py-1.5 rounded-lg uppercase tracking-widest">Pending Vouchers: <b id="chk-count-total" class="text-slate-900">0</b></span>
          </div>
          
          <div class="flex gap-2 w-full lg:w-auto items-center">
              <button onclick="window.CheckerLoad()" class="flex-1 lg:flex-none bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2.5 rounded-xl text-sm font-black shadow-sm transition flex justify-center items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh Data
              </button> 
              <!-- Add this INSIDE your sticky header, right below the Refresh button -->
    <div id="chk-bulk-actions" class="hidden w-full bg-slate-800 text-white mt-4 p-3 rounded-xl flex justify-between items-center shadow-lg transition-all fade-in">
        <div class="flex items-center gap-3 px-2">
            <span class="flex h-6 w-6 items-center justify-center rounded-full bg-indigo-500 text-xs font-black" id="chk-selected-count">0</span>
            <span class="text-xs font-bold uppercase tracking-widest text-slate-300">Vouchers Selected</span>
        </div>
        <div class="flex gap-2">
            <button onclick="window.processBulk('REJECT')" class="bg-rose-900/50 hover:bg-rose-600 border border-rose-500 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition">Reject All</button>
            <button onclick="window.processBulk('APPROVE')" class="bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition shadow-sm">Approve All</button>
        </div>
    </div>
          </div>
        </div>
    </div>
  </div>

  <!-- STATUS BOXES -->
  <div id="chk-loading" class="p-12 text-center text-slate-500 font-bold hidden flex-col items-center justify-center gap-3">
    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-500 mx-auto mb-4"></div>
    Fetching Pending Vouchers...
  </div>
  <div id="chk-empty" class="p-12 text-center text-slate-500 font-bold hidden bg-white rounded-xl border border-slate-200 shadow-sm mx-2">
    <span class="text-4xl block mb-3">🎉</span> No pending approvals. The ledger is clear!
  </div>

  <!-- PC VIEW: STICKY TABLE (Hidden on Mobile) -->
  <div class="hidden md:block relative overflow-x-auto max-h-[65vh] shadow-sm rounded-xl border border-slate-200 bg-white hide-scrollbar mx-2" id="chk-pc-table-container">
    <table class="w-full text-left border-collapse whitespace-nowrap">
      <thead class="bg-slate-100 text-slate-600 text-[10px] uppercase tracking-wider sticky top-0 z-20 shadow-sm">
        <tr>
          <!-- COMBINED STICKY COLUMN: Checkbox + Date/ID -->
          <th class="p-4 font-black sticky left-0 bg-slate-100 z-30 shadow-[1px_0_0_rgba(203,213,225,1)] flex items-center gap-3 border-none">
            <input type="checkbox" id="chk-select-all" onchange="window.toggleAllCheckboxes(this)" class="w-4 h-4 text-indigo-600 bg-white border-slate-300 rounded focus:ring-indigo-500 cursor-pointer">
            <span>Date & ID</span>
          </th>
          <th class="p-4 font-black">Voucher Type</th>
          <th class="p-4 font-black">Ledgers (Dr / Cr)</th>
          <th class="p-4 font-black text-right">Amount (₹)</th>
          <th class="p-4 font-black text-center">Action</th>
        </tr>
      </thead>
      <tbody id="chk-table-body" class="text-sm divide-y divide-slate-100">
         <!-- PC Table Rows Injected Here -->
      </tbody>
    </table>
  </div>

  <!-- MOBILE VIEW: CARDS (Hidden on PC) -->
  <div id="chk-mobile-wrapper" class="md:hidden px-2 pb-10">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm mb-4 flex items-center gap-3">
          <input type="checkbox" id="chk-select-all-mobile" onchange="window.toggleAllCheckboxes(this)" class="w-5 h-5 text-indigo-600 bg-white border-slate-300 rounded focus:ring-indigo-500 cursor-pointer">
          <label for="chk-select-all-mobile" class="text-sm font-black text-slate-700 uppercase tracking-widest cursor-pointer">Select All Vouchers</label>
      </div>
      
      <div id="chk-mobile-cards" class="space-y-4">
          <!-- Mobile Cards Injected Here -->
      </div>
  </div>

  <!-- EDIT & APPROVE MODAL (Re-styled to match your aesthetic) -->
  <div id="modal-checker-edit" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 overflow-hidden fade-in">
      
      <div class="bg-amber-50 border-b border-amber-200 px-6 py-4 flex justify-between items-center">
        <h3 class="font-black text-amber-900 text-lg uppercase tracking-wide flex items-center gap-2">⚠️ Review Voucher</h3>
        <button onclick="window.closeCheckerModal()" class="text-amber-700 hover:text-amber-900 transition text-2xl font-black leading-none outline-none">&times;</button>
      </div>

      <div class="p-6 space-y-4 bg-slate-50">
        <input type="hidden" id="chk-jv-id">
        
        <div class="grid grid-cols-2 gap-4 text-xs">
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <span class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Debit (Dr)</span>
            <span id="chk-dr-name" class="font-black text-slate-700 block whitespace-normal"></span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <span class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Credit (Cr)</span>
            <span id="chk-cr-name" class="font-black text-slate-700 block whitespace-normal"></span>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Modify Amount (₹)</label>
          <input type="number" id="chk-amount" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-black text-lg text-slate-800 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
        </div>

        <div>
          <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Remarks / Narration</label>
          <input type="text" id="chk-narration" class="w-full p-3 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition">
        </div>
        
        <p id="chk-modal-error" class="text-xs font-bold text-rose-600 hidden bg-rose-50 p-2 rounded border border-rose-200"></p>
      </div>

      <div class="bg-white border-t border-slate-200 p-4 flex flex-wrap gap-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20 rounded-b-2xl">
        <button onclick="window.processVoucher('VOID')" class="flex-1 bg-white border-2 border-slate-300 text-slate-600 hover:bg-slate-100 font-black text-[10px] px-2 py-3.5 rounded-xl uppercase tracking-widest transition">Void</button>
        <button onclick="window.processVoucher('REJECT')" class="flex-1 bg-white border-2 border-rose-200 text-rose-600 hover:bg-rose-50 font-black text-[10px] px-2 py-3.5 rounded-xl uppercase tracking-widest transition">Reject</button>
        <button id="btn-chk-approve" onclick="window.processVoucher('EDIT_AND_APPROVE')" class="flex-none w-full md:w-auto md:flex-1 bg-slate-800 hover:bg-slate-900 text-white font-black text-[10px] px-4 py-3.5 rounded-xl uppercase tracking-widest transition shadow-lg">Save & Approve</button>
      </div>
    </div>
  </div>
</div>
