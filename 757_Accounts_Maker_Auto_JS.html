<script>
    window.cachedAutoDrafts = [];

    window.MakerAutoLoad = function () {
        // 1. Set Default Dates if empty
        var startDateInput = document.getElementById('auto-start-date');
        var endDateInput = document.getElementById('auto-end-date');

        if (!startDateInput.value || !endDateInput.value) {
            var date = new Date();
            var firstDay = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
            var today = date.toISOString().split('T')[0];
            startDateInput.value = firstDay;
            endDateInput.value = today;
        }

        // 2. Fetch Data
        document.getElementById('auto-loading').style.display = 'block';
        document.getElementById('auto-empty').style.display = 'none';
        document.getElementById('auto-list-container').innerHTML = '';

        google.script.run.withSuccessHandler(function (res) {
            document.getElementById('auto-loading').style.display = 'none';
            if (res.success) {
                window.cachedAutoDrafts = res.data;
                if (res.data.length === 0) {
                    document.getElementById('auto-empty').style.display = 'block';
                } else {
                    renderAutoList(res.data);
                }
            }
        }).accounts_getPendingMakerVouchers();

        // Get today's date formatted as YYYY-MM-DD
        var today1 = new Date().toISOString().split('T')[0];

        // Auto-fill all 4 date inputs
        document.getElementById('auto-start-date').value = today1;
        document.getElementById('auto-end-date').value = today1;
        document.getElementById('supp-start-date').value = today1;
        document.getElementById('supp-end-date').value = today1;
    };

    function renderAutoList(data) {
    let html = '';
    data.forEach(vch => {

        let isEmployee = vch.narration.includes('Employee Payroll');
        let cardBorder = isEmployee ? 'border-l-fuchsia-500' : 'border-l-indigo-500';
        let badgeBg    = isEmployee ? 'bg-fuchsia-100 text-fuchsia-800' : 'bg-indigo-100 text-indigo-800';

        html += `
        <div class="bg-white p-4 rounded-xl border-l-[6px] ${cardBorder} shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-md transition">
           <div>
              <span class="text-[9px] font-black ${badgeBg} px-2 py-0.5 rounded uppercase tracking-widest">${vch.jvId}</span>
              <p class="font-bold text-slate-800 mt-1">${vch.narration}</p>
              <p class="text-xs text-slate-500 font-medium">Pending Ledgers: <span class="text-rose-500 font-bold">Unmapped</span></p>
           </div>
           <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
              <p class="text-lg font-black text-slate-800">₹${parseFloat(vch.amount).toLocaleString('en-IN')}</p>
              <div class="flex items-center gap-2">
                  <button onclick="window.openAutoBreakdown('${vch.jvId}')" class="text-slate-500 hover:text-indigo-700 bg-slate-100 hover:bg-indigo-100 px-3 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest transition">Breakdown</button>
                  <button onclick="window.openAutoModal('${vch.jvId}')" class="bg-fuchsia-50 text-fuchsia-700 hover:bg-fuchsia-600 hover:text-white border border-fuchsia-200 px-4 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest transition shadow-sm active:scale-95">Map & Submit</button>
              </div>
           </div>
        </div>
      `;
    });
    document.getElementById('auto-list-container').innerHTML = html;
}

    function runEmployeeAutomation() {
        const sDate = document.getElementById('auto-start-date').value;
        const eDate = document.getElementById('auto-end-date').value;
        const btn = document.getElementById('btn-run-auto');

        if (!sDate || !eDate) {
            alert("Please select both a Start and End Date.");
            return;
        }

        btn.innerText = "PROCESSING...";
        btn.disabled = true;

        // Send to the backend
        google.script.run.withSuccessHandler(function (response) {
            alert(response.message);
            btn.innerText = "GENERATE EMPLOYEE DRAFTS";
            btn.disabled = false;
            if (response.success && typeof window.MakerAutoLoad === "function") {
                window.MakerAutoLoad(); // Refresh the grid
            }
        }).accounts_generateAutomatedVouchers({
            startDate: sDate,
            endDate: eDate,
            makerEmail: "Web App Portal"
        });
    }

    function resetAutomatedDrafts() {
        if (!confirm("Are you sure? This will delete all pending automated drafts and allow you to re-run the dates.")) return;

        google.script.run.withSuccessHandler(function (response) {
            alert(response.message);
            if (typeof window.MakerAutoLoad === "function") {
                window.MakerAutoLoad(); // Refresh the grid to clear the UI
            }
        }).accounts_clearAutomatedDrafts();
    }

    function switchAutoTab(tab) {
        const btnStaff = document.getElementById('tab-btn-staff');
        const btnSupplier = document.getElementById('tab-btn-supplier');
        const panelStaff = document.getElementById('tab-panel-staff');
        const panelSupplier = document.getElementById('tab-panel-supplier');

        if (tab === 'staff') {
            // Style buttons
            btnStaff.className = "pb-3 text-sm font-black uppercase tracking-widest border-b-2 border-fuchsia-600 text-fuchsia-600 transition outline-none";
            btnSupplier.className = "pb-3 text-sm font-black uppercase tracking-widest border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition outline-none";
            // Show/Hide Panels
            panelStaff.classList.remove('hidden');
            panelStaff.classList.add('block');
            panelSupplier.classList.remove('block');
            panelSupplier.classList.add('hidden');
        } else {
            // Style buttons
            btnSupplier.className = "pb-3 text-sm font-black uppercase tracking-widest border-b-2 border-fuchsia-600 text-fuchsia-600 transition outline-none";
            btnStaff.className = "pb-3 text-sm font-black uppercase tracking-widest border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition outline-none";
            // Show/Hide Panels
            panelSupplier.classList.remove('hidden');
            panelSupplier.classList.add('block');
            panelStaff.classList.remove('block');
            panelStaff.classList.add('hidden');
        }
    }

    window.closeBreakdownModal = function () {
        document.getElementById('modal-auto-breakdown').classList.add('hidden');
    };

    window.copyBreakdown = function () {
        const title = document.getElementById('breakdown-subtitle').innerText;
        const rows = document.querySelectorAll('#breakdown-table-body tr');
        const total = document.getElementById('breakdown-total').innerText;

        if (rows.length === 0 || rows[0].innerText.includes('No records found')) {
            alert("No data to copy.");
            return;
        }

        let clipboardText = `*WOW DROPS PAYOUT BREAKDOWN*\n`;
        clipboardText += `👤 ${title}\n`;
        clipboardText += `------------------------\n`;

        rows.forEach(row => {
            let cells = row.querySelectorAll('td');
            if (cells.length === 2) {
                clipboardText += `${cells[0].innerText} : ${cells[1].innerText}\n`;
            }
        });

        clipboardText += `------------------------\n`;
        clipboardText += `*Total: ${total}*\n`;

        // Copy to clipboard
        navigator.clipboard.writeText(clipboardText).then(() => {
            const btn = document.getElementById('btn-copy-breakdown');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `✓ COPIED!`;
            btn.classList.replace('bg-emerald-600', 'bg-slate-800');

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-slate-800', 'bg-emerald-600');
            }, 2000);
        }).catch(err => {
            alert("Failed to copy text. Your browser might block this feature.");
        });
    };

    // --- MODAL & MAPPING LOGIC ---
    window.openAutoModal = function (jvId) {
        const vch = window.cachedAutoDrafts.find(v => v.jvId === jvId);
        if (!vch) return;

        const mapHeader = document.getElementById('auto-map-header');
        const mapTitle = document.getElementById('auto-map-title');
        const isEmployee = vch.narration.includes('Employee Payroll');

        if (isEmployee) {
            mapHeader.className = "px-6 py-4 flex justify-between items-center rounded-t-2xl border-b bg-fuchsia-50 border-fuchsia-200";
            mapTitle.className = "font-black text-sm uppercase tracking-widest text-fuchsia-900";
        } else {
            mapHeader.className = "px-6 py-4 flex justify-between items-center rounded-t-2xl border-b bg-indigo-50 border-indigo-200";
            mapTitle.className = "font-black text-sm uppercase tracking-widest text-indigo-900";
        }

        // --- 1. FIRST: Reset all inputs to clear data from the previously opened modal ---
        document.getElementById('auto-dr-search').value = '';
        document.getElementById('auto-dr-account').value = '';
        document.getElementById('auto-cr-search').value = '';
        document.getElementById('auto-cr-account').value = '';
        document.getElementById('auto-modal-error').classList.add('hidden');

        // --- 2. SECOND: Inject the specific details for the clicked voucher ---
        document.getElementById('auto-map-jv').value = jvId;
        document.getElementById('auto-map-narration').innerText = vch.narration;
        document.getElementById('auto-map-amount').value = vch.amount;

        // --- 3. THIRD: Pre-fill the Debit Ledger mapped from the Master Sheet ---
        document.getElementById('auto-dr-account').value = vch.source;
        document.getElementById('auto-dr-search').value = vch.source === "L0002" ? "SALARY EXP" : vch.source;


        // Initialize autocomplete specifically for this modal (re-uses masterLedgers from Maker Load)
        if (window.masterLedgers && window.masterLedgers.length > 0) {
            // Re-using the setup function from 755_Accounts_Maker_JS.html!
            window.currentVoucherType = 'PAYMENT'; // Assuming payroll/supplier are payments
            window.setupAutocomplete('auto-dr-search', 'auto-dr-dropdown', 'auto-dr-account', 'auto-cr-account');
            window.setupAutocomplete('auto-cr-search', 'auto-cr-dropdown', 'auto-cr-account', 'auto-dr-account');
        } else {
            alert("Ledgers not loaded. Please visit the Maker Entry tab once to initialize ledgers.");
        }

        document.getElementById('modal-auto-map').classList.remove('hidden');
    };

    window.closeAutoModal = function () {
        document.getElementById('modal-auto-map').classList.add('hidden');
    };

    window.submitAutoDraft = function () {
        var dr = document.getElementById('auto-dr-account').value;
        var cr = document.getElementById('auto-cr-account').value;
        var amt = parseFloat(document.getElementById('auto-map-amount').value);
        var err = document.getElementById('auto-modal-error');
        var btn = document.getElementById('btn-auto-submit');

        if (!dr || !cr) { err.innerText = "Please select valid ledgers from the dropdown."; err.classList.remove('hidden'); return; }
        if (dr === cr) { err.innerText = "Debit and Credit cannot be the same."; err.classList.remove('hidden'); return; }

        err.classList.add('hidden');
        btn.innerText = "Submitting..."; btn.disabled = true;

        var payload = {
            jvId: document.getElementById('auto-map-jv').value,
            drAccount: dr, crAccount: cr, newAmount: amt,
            newNarration: document.getElementById('auto-map-narration').innerText,
            makerEmail: window.activeAccountsSession ? window.activeAccountsSession.username : 'Unknown'
        };

        google.script.run.withSuccessHandler(function (res) {
            btn.innerText = "Submit to Checker"; btn.disabled = false;
            if (res.success) {
                window.closeAutoModal(); window.MakerAutoLoad();
            } else {
                err.innerText = res.message; err.classList.remove('hidden');
            }
        }).withFailureHandler(function (e) {
            btn.innerText = "Submit to Checker"; btn.disabled = false;
            err.innerText = "Network Error"; err.classList.remove('hidden');
        }).accounts_submitPendingMakerVoucher(payload);
    };

    // --- UPDATED FETCH SCRIPT ---
    function fetchSupplierMatrix() {
        const sDate = document.getElementById('supp-start-date').value;
        const eDate = document.getElementById('supp-end-date').value;
        const btn = document.getElementById('btn-fetch-supplier');
        const container = document.getElementById('supplierMatrixContainer');

        if (!sDate || !eDate) return alert("Please select both a Start and End Date.");

        btn.innerText = "FETCHING...";
        btn.disabled = true;
        container.innerHTML = `<div class="p-8 text-center text-slate-500 font-bold animate-pulse">Scanning Data...</div>`;

        google.script.run.withSuccessHandler(function (response) {
            btn.innerText = "FETCH DAILY TOTALS";
            btn.disabled = false;

            if (response.success) {
                // Pass BOTH data and suppliers to the renderer
                renderSupplierMatrixUI(response.data, response.suppliers);
            } else {
                container.innerHTML = `<div class="p-4 bg-rose-50 text-rose-600 rounded-lg border border-rose-200 font-bold text-sm">${response.message}</div>`;
            }
        }).withFailureHandler(function (error) {
            btn.innerText = "FETCH DAILY TOTALS";
            btn.disabled = false;
            container.innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg border border-red-300 font-bold text-sm">Error: ${error.message}</div>`;
        }).accounts_getSupplierUnloadData(sDate, eDate);
    }

            supplierHeaders += `<th class="p-3 font-black text-center text-fuchsia-800 bg-fuchsia-50/50 border-x border-fuchsia-100">${sup.name} <span class="block text-[9px] text-fuchsia-400">@ ₹${sup.rate}</span></th>`;
        });

        let html = `
  <div class="mt-4 border border-slate-200 rounded-2xl overflow-x-auto shadow-sm fade-in bg-white">
    <table class="w-full text-left border-collapse min-w-max">
      <thead class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-widest border-b border-slate-200">
        <tr>
          <th class="p-3 pl-5 font-black sticky left-0 bg-slate-50 z-10 shadow-[1px_0_0_0_#e2e8f0]">Date</th>
          <th class="p-3 font-black text-center text-slate-600 border-x border-slate-200" title="Physical Unload Count">1. Unload</th>
          <th class="p-3 font-black text-center text-amber-600 bg-amber-50/30 border-r border-slate-200" title="Add Leaked Cans">2. Leak/Misc (+)</th>

          <th class="p-3 pr-5 font-black text-right border-l border-slate-200 sticky right-0 bg-slate-50 z-10 shadow-[-1px_0_0_0_#e2e8f0]">Balance</th>
        </tr>
      </thead>
      <tbody class="text-sm divide-y divide-slate-100">`;

        // Build Dynamic Rows
        data.forEach((row) => {

            let supplierInputs = '';

                supplierInputs += `<td class="p-2 border-x border-fuchsia-50 bg-fuchsia-50/10">
           <input type="number" min="0" class="sup-input w-24 mx-auto block p-2 border border-slate-200 rounded-lg text-center outline-none focus:border-fuchsia-500 focus:ring-2 focus:ring-fuchsia-100 font-bold text-slate-700 placeholder-slate-300 transition" placeholder="0" data-sup="${sup.name}" oninput="validateMatrixRow(this)">

           <div class="animate-pulse w-2.5 h-2.5 rounded-full bg-amber-500"></div>

    // --- DYNAMIC MATH & VALIDATION ---
    function validateMatrixRow(inputElement) {
        const tr = inputElement.closest('tr');

        // 1. Get Base Data
        const unloaded = parseInt(tr.getAttribute('data-unloaded')) || 0;
        const leak = parseInt(tr.querySelector('.leak-input').value) || 0;

        // 2. Calculate New Target (Unloaded + Leakage)
        const target = unloaded + leak;
        tr.querySelector('.target-cell').innerText = target;

        // 3. Sum All Dynamic Supplier Inputs
        let allocated = 0;
        tr.querySelectorAll('.sup-input').forEach(inp => {
            allocated += (parseInt(inp.value) || 0);
        });

        // 4. Calculate Balance
        const balance = target - allocated;
        const balanceCell = tr.querySelector('.balance-cell');

        balanceCell.innerText = balance;

        // 5. Visual Indicators
        if (balance === 0) {
            balanceCell.className = "p-3 pr-5 font-black text-right balance-cell text-emerald-500 sticky right-0 bg-emerald-50 z-10 shadow-[-1px_0_0_0_#f1f5f9]";
            balanceCell.innerHTML = `<i class="bi bi-check-lg mr-1"></i> OK`;
        } else if (balance < 0) {
            balanceCell.className = "p-3 pr-5 font-black text-right balance-cell text-rose-500 sticky right-0 bg-rose-50 z-10 shadow-[-1px_0_0_0_#f1f5f9]";
        } else {
            balanceCell.className = "p-3 pr-5 font-black text-right balance-cell text-amber-500 sticky right-0 bg-white group-hover:bg-slate-50 transition z-10 shadow-[-1px_0_0_0_#f1f5f9]";
        }

        checkMatrixOverallValidity();
    }

    function checkMatrixOverallValidity() {
        let allValid = true;
        const rows = document.querySelectorAll('.matrix-row');

        rows.forEach(tr => {
            const target = parseInt(tr.querySelector('.target-cell').innerText) || 0;

            let allocated = 0;
            tr.querySelectorAll('.sup-input').forEach(inp => {
                allocated += (parseInt(inp.value) || 0);
            });

            if (target - allocated !== 0) {
                allValid = false;
            }
        });

        const btn = document.getElementById('btn-generate-supplier');
        const status = document.getElementById('matrix-status');

        if (allValid && rows.length > 0) {
            btn.disabled = false;
            btn.className = "bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-black text-xs px-8 py-3.5 rounded-xl uppercase tracking-widest transition shadow-[0_8px_16px_-4px_rgba(192,38,211,0.3)] cursor-pointer";
            status.innerHTML = `<div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div> <span class="text-xs font-black text-emerald-600 uppercase tracking-widest">Matrix Perfectly Balanced</span>`;
        } else {
            btn.disabled = true;
            btn.className = "bg-slate-200 text-slate-400 font-black text-xs px-8 py-3.5 rounded-xl uppercase tracking-widest transition shadow-sm cursor-not-allowed";
            status.innerHTML = `<div class="animate-pulse w-2.5 h-2.5 rounded-full bg-amber-500"></div> <span class="text-xs font-black text-slate-500 uppercase tracking-widest">Pending Allocation</span>`;
        }
    }

    // --- PACKAGE & SUBMIT DRAFTS ---
    function submitSupplierDrafts() {
        const sDate = document.getElementById('supp-start-date').value;
        const eDate = document.getElementById('supp-end-date').value;
        const btn = document.getElementById('btn-generate-supplier');
        const rows = document.querySelectorAll('.matrix-row');

        let payloadData = [];

        // Loop through the matrix and harvest all allocated cans
        rows.forEach(tr => {
            let rowData = {
                date: tr.getAttribute('data-date'),
                displayDate: tr.getAttribute('data-display'),
                allocations: []
            };

            tr.querySelectorAll('.sup-input').forEach(inp => {
                const cans = parseInt(inp.value) || 0;
                if (cans > 0) {
                    rowData.allocations.push({
                        supplier: inp.getAttribute('data-sup'),
                        cans: cans
                    });
                }
            });

            if (rowData.allocations.length > 0) {
                payloadData.push(rowData);
            }
        });

        if (payloadData.length === 0) {
            alert("No cans have been allocated to any suppliers.");
            return;
        }

        btn.innerText = "PROCESSING...";
        btn.disabled = true;

        // Send payload to the Google Apps Script Backend
        google.script.run
            .withSuccessHandler(function (response) {
                alert(response.message);
                if (response.success) {
                    // Clear the matrix and refresh the pending list
                    document.getElementById('supplierMatrixContainer').innerHTML = "";
                    if (typeof window.MakerAutoLoad === "function") window.MakerAutoLoad();
                } else {
                    btn.innerText = "GENERATE SUPPLIER DRAFTS";
                    btn.disabled = false;
                }
            })
            .withFailureHandler(function (error) {
                alert("Error: " + error.message);
                btn.innerText = "GENERATE SUPPLIER DRAFTS";
                btn.disabled = false;
            })
            .accounts_generateSupplierVouchers({
                startDate: sDate,
                endDate: eDate,
                makerEmail: "Web App Portal",
                matrixData: payloadData
            });
    }

    // --- 1. INSTANT BREAKDOWN PARSER ---
    window.openAutoBreakdown = function (jvId) {
        const vch = window.cachedAutoDrafts.find(v => v.jvId === jvId);
        if (!vch) return;
        
        const narration = vch.narration;
        const modal = document.getElementById('modal-auto-breakdown');
        const header = document.getElementById('breakdown-header');
        const titleText = document.getElementById('breakdown-title');
        const subtitle = document.getElementById('breakdown-subtitle');
        const tbody = document.getElementById('breakdown-table-body');
        const totalEl = document.getElementById('breakdown-total');

        // Identify Type for Alpha New Gen Theming
        const isEmployee = narration.includes('Employee Payroll');

        // Apply Dynamic Colors
        if (isEmployee) {
            header.className = "px-6 py-4 flex justify-between items-center shrink-0 border-b bg-fuchsia-50 border-fuchsia-200";
            titleText.className = "font-black text-sm uppercase tracking-widest flex items-center gap-2 text-fuchsia-900";
            subtitle.className = "text-[10px] font-bold uppercase tracking-widest mt-0.5 text-fuchsia-600";
            totalEl.className = "p-3 pr-6 font-black text-fuchsia-700 text-sm text-right";
        } else {
            header.className = "px-6 py-4 flex justify-between items-center shrink-0 border-b bg-indigo-50 border-indigo-200";
            titleText.className = "font-black text-sm uppercase tracking-widest flex items-center gap-2 text-indigo-900";
            subtitle.className = "text-[10px] font-bold uppercase tracking-widest mt-0.5 text-indigo-600";
            totalEl.className = "p-3 pr-6 font-black text-indigo-700 text-sm text-right";
        }

        try {
            // Extract Name & Date Range
            let nameMatch = narration.match(/:\s([^(]+)\s\(/);
            let name = nameMatch ? nameMatch[1].trim() : "Details";
            let dateRangeMatch = narration.match(/-\s(\d{4}-\d{2}-\d{2}\sto\s\d{4}-\d{2}-\d{2})$/);
            let dateRange = dateRangeMatch ? dateRangeMatch[1] : "";
            subtitle.innerText = `${name} | ${dateRange}`;

            // Extract Financial Math for Footer (e.g., 3 Days @ Rs600 = Rs1800)
            let mathMatch = narration.match(/\((.*?=.*?)\)/);
            totalEl.innerText = mathMatch ? mathMatch[1] : "Math Applied";

            // Extract & Parse Daily Actions
            let detailsPart = narration.split('||')[1];
            if (dateRangeMatch) detailsPart = detailsPart.replace('- ' + dateRangeMatch[1], '');

            let days = detailsPart.split('|');
            let rowsHtml = '';

            days.forEach(day => {
                let parts = day.split(':');
                if (parts.length === 2) {
                    rowsHtml += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 pl-6 font-bold text-slate-700 whitespace-nowrap border-b border-slate-100">${parts[0].trim()}</td>
                    <td class="p-3 pr-6 font-semibold text-slate-600 text-right border-b border-slate-100">${parts[1].trim()}</td>
                </tr>`;
                }
            });
            tbody.innerHTML = rowsHtml;

            // Bypass backend loading entirely!
            document.getElementById('breakdown-loading').classList.add('hidden');
            document.getElementById('breakdown-content').classList.remove('hidden');
            document.getElementById('breakdown-content').classList.add('flex-1');

        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-rose-500 font-bold">Could not parse breakdown.</td></tr>`;
        }

        modal.classList.remove('hidden');
    };


</script>
